<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d9cfc4"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#5a3c1e" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e07a4f"/>
    </marker>
    <g id="sheet">
      <rect width="120" height="156" rx="6" fill="#fffdfa" stroke="#e0d7cd"/>
      <rect x="14" y="16" width="64" height="8" rx="4" fill="#2b2622" opacity="0.8"/>
      <rect x="14" y="30" width="42" height="4" rx="2" fill="#8a8079"/>
      <rect x="14" y="46" width="30" height="2" fill="#e07a4f"/>
      <rect x="14" y="54" width="92" height="4" rx="2" fill="#e9e2da"/>
      <rect x="14" y="62" width="78" height="4" rx="2" fill="#e9e2da"/>
      <rect x="14" y="78" width="30" height="2" fill="#e07a4f"/>
      <rect x="14" y="86" width="88" height="4" rx="2" fill="#e9e2da"/>
      <rect x="14" y="94" width="70" height="4" rx="2" fill="#e9e2da"/>
      <rect x="14" y="102" width="82" height="4" rx="2" fill="#e9e2da"/>
      <rect x="14" y="118" width="30" height="2" fill="#e07a4f"/>
      <rect x="14" y="126" width="60" height="4" rx="2" fill="#e9e2da"/>
    </g>
  </defs>

  <rect width="860" height="300" rx="18" fill="#f3eee8"/>
  <rect width="860" height="300" rx="18" fill="url(#dots)" opacity="0.7"/>

  <!-- Content -->
  <g transform="translate(40 62)" filter="url(#shadow)">
    <rect width="190" height="176" rx="14" fill="#f9f6f2" stroke="#e0d7cd"/>
    <text x="18" y="32" font-size="15" font-weight="700" fill="#2b2622">▤ Content</text>
    <text x="18" y="52" font-size="11.5" fill="#8a8079">resumes/*.yaml</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#5b524b">
      <text x="18" y="84">template: <tspan fill="#e07a4f">basic</tspan></text>
      <text x="18" y="104">role: Backend Dev</text>
      <text x="18" y="124">experience:</text>
      <text x="18" y="144">  - company: Acme</text>
    </g>
  </g>

  <!-- Template -->
  <g transform="translate(330 62)" filter="url(#shadow)">
    <rect width="190" height="176" rx="14" fill="#f9f6f2" stroke="#e07a4f" stroke-width="1.5"/>
    <text x="18" y="32" font-size="15" font-weight="700" fill="#2b2622">▦ Template</text>
    <text x="18" y="52" font-size="11.5" fill="#8a8079">templates/basic/</text>
    <g font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#5b524b">
      <text x="18" y="84"><tspan fill="#e07a4f">#set</tspan> text(font: …)</text>
      <text x="18" y="104"><tspan fill="#e07a4f">#show</tspan> heading: …</text>
      <text x="18" y="124">= Experience</text>
      <text x="18" y="144">schema.json ✓</text>
    </g>
  </g>

  <path d="M240 150 H318" stroke="#e07a4f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M530 150 C 570 150, 580 100, 615 92" stroke="#e07a4f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M530 150 H612" stroke="#e07a4f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M530 150 C 570 150, 580 200, 615 208" stroke="#e07a4f" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Resumes -->
  <g filter="url(#shadow)">
    <use href="#sheet" transform="translate(700 40) rotate(8 60 78) scale(0.85)"/>
    <use href="#sheet" transform="translate(660 68) rotate(-4 60 78) scale(0.9)"/>
    <use href="#sheet" transform="translate(624 86)"/>
  </g>
  <text x="684" y="275" font-size="12.5" text-anchor="middle" fill="#8a8079">every linked resume, restyled</text>
</svg>
