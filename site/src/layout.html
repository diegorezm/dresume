<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{hero.sub}}">
<link rel="icon" href="{{base}}icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
<link rel="stylesheet" href="{{base}}theme.css">
<link rel="stylesheet" href="{{base}}style.css">
<script>try{const t=localStorage.getItem("dresume-theme");if(t)document.documentElement.dataset.theme=t}catch{}</script>
</head>
<body class="page-{{page}}">
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="{{home}}"><img src="{{base}}icon.svg" alt="" width="26" height="26">dresume</a>
    <nav>
      <a href="{{home}}#features">{{nav.features}}</a>
      <a href="{{docsUrl}}">{{nav.docs}}</a>
      <a href="https://github.com/diegorezm/dresume">GitHub</a>
      <a class="chip" href="{{otherLang}}" hreflang="{{nav.otherLangCode}}">{{nav.otherLang}}</a>
    </nav>
  </div>
</header>
{{body}}
<footer class="foot">
  <div class="wrap foot-in">
    <span>dresume v{{version}} · AGPL-3.0-or-later</span>
    <span>{{foot.made}} <a href="https://typst.app/">Typst</a></span>
  </div>
</footer>
<script src="{{base}}site.js"></script>
</body>
</html>
